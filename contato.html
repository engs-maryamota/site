<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cantinho Digital - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header id="cabecalho-principal">
           <div class="logo">
            <h1>🌸 Marya Mota Confeitaria Gourmet</h1>
        <p class="subtitulo">Entre em contato comigo</p>
        </div>
        <nav id="menu-navegacao">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre Mim</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

 <main class="container-principal">
        <section class="card-conteudo">
            <h2>Fale Comigo</h2>
            <p>Envie uma mensagem ou entre em contato através das redes sociais abaixo:</p>


            <form class="formulario-contato">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>


                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>


                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>


                <button type="submit" class="botao-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>



  
      <footer id="rodape-site">
        <p>&copy; 2026 - Desenvolvido por Marya Mota. Todos os direitos reservados.</p>
    </footer>


</body>
</html>
